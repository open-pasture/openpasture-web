<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <!-- #0E0D0B is --bg in assets/op.css; a meta tag cannot read the token, so change both together. -->
  <meta name="theme-color" content="#0E0D0B">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:site_name" content="Open Pasture">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{siteUrl}}/assets/og.png?v={{v}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogImageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{siteUrl}}/assets/og.png?v={{v}}">
  <meta name="twitter:image:alt" content="{{ogImageAlt}}">
  <link rel="icon" href="/assets/favicon.svg?v={{v}}" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v={{v}}">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v={{v}}">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v={{v}}">
  <link rel="preload" href="/assets/fonts/barlow-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/barlow-latin-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/op.css?v={{v}}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="wrap">
    {{> header}}
    <main id="main" tabindex="-1">
{{content}}
    </main>
    {{> footer}}
  </div>
  <script src="/assets/site.js?v={{v}}" defer></script>
</body>
</html>
